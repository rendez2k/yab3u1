<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3MF &rarr; Snapmaker U1</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel2: #22262e;
    --line: #2e333d;
    --text: #e6e9ef;
    --dim: #939aa8;
    --accent: #f7a33c;
    --ok: #4ec98a;
    --bad: #ef6f6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 26px; font-size: 14px; }

  #drop {
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 44px 20px; text-align: center; cursor: pointer;
    background: var(--panel); transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--panel2); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 6px; }
  #drop span { color: var(--dim); font-size: 13px; }
  #drop input { display: none; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-top: 20px;
  }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .07em;
             color: var(--dim); margin: 0 0 14px; font-weight: 600; }
  .hidden { display: none !important; }

  .facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-bottom: 4px; }
  .fact b { display: block; font-size: 13px; color: var(--dim); font-weight: 500; }
  .fact span { font-size: 15px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
          font-size: 12px; background: var(--panel2); border: 1px solid var(--line);
          color: var(--dim); }
  .pill.on { color: var(--ok); border-color: #2c5c46; }

  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num { color: var(--dim); font-variant-numeric: tabular-nums; }
  td.use { color: var(--dim); font-size: 13px; }

  input[type=color] {
    width: 46px; height: 30px; padding: 0; border: 1px solid var(--line);
    border-radius: 6px; background: none; cursor: pointer;
  }
  select, input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px;
  }
  select { max-width: 100%; }
  input[type=number] { width: 80px; }

  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--dim); text-transform: uppercase;
                 letter-spacing: .06em; }
  .field.grow { flex: 1 1 240px; }
  .field select { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px;
           color: var(--text); }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  button {
    font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 9px 16px;
  }
  button:hover:not(:disabled) { border-color: #454c59; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #201703; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 20px;
             flex-wrap: wrap; }

  .hint { color: var(--dim); font-size: 13px; }
  #log {
    font: 12px/1.6 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap;
    background: #0f1114; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; max-height: 260px; overflow: auto; margin-top: 16px;
    color: #b9c2d0;
  }
  .err { color: var(--bad); }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite; display: inline-block;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.dl { color: var(--accent); font-weight: 600; text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">

  <h1>3MF &rarr; <span>Snapmaker U1</span></h1>
  <p class="sub">Keeps multi-colour painting intact, rebuilds the U1 profile, and can fill the plate.</p>

  <div id="drop">
    <strong>Drop a .3mf here</strong>
    <span>or click to choose a file &mdash; Bambu Studio, OrcaSlicer or PrusaSlicer projects</span>
    <input type="file" id="file" accept=".3mf">
  </div>

  <div class="card hidden" id="source">
    <h2>Source</h2>
    <div class="facts" id="facts"></div>
    <div id="slotarea"></div>
  </div>

  <div class="card hidden" id="options">
    <h2>Plate &amp; profiles</h2>
    <div class="row">
      <div class="field grow">
        <label for="filament">Filament profile</label>
        <select id="filament"></select>
      </div>
      <div class="field grow">
        <label for="process">Process profile</label>
        <select id="process"></select>
      </div>
    </div>
    <div class="row" style="margin-top:18px">
      <div class="field">
        <label for="copies">Copies</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" id="copies" min="1" value="1">
          <button id="fill">Fill bed</button>
        </div>
      </div>
      <div class="field">
        <label for="gap">Spacing (mm)</label>
        <input type="number" id="gap" min="0" step="0.5" value="5">
      </div>
      <div class="field">
        <label for="supports">Supports</label>
        <select id="supports">
          <option value="auto" selected>From the source file</option>
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <label class="check"><input type="checkbox" id="tower" checked> Leave room for the prime tower</label>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <label class="check"><input type="checkbox" id="repos" checked> Centre if off the plate</label>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <label class="check"><input type="checkbox" id="verify" checked> Check it slices (slower)</label>
      </div>
    </div>
    <p class="hint" id="supporthint" style="margin:16px 0 0"></p>
    <p class="hint" id="fithint" style="margin:8px 0 0"></p>

    <div class="actions">
      <button class="primary" id="go">Convert and download</button>
      <button id="again">Choose another file</button>
    </div>
    <div id="log" class="hidden"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let state = { id: null, data: null, timer: null };

function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- drop zone ---------- */
const drop = $('drop'), picker = $('file');
drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => { if (picker.files[0]) upload(picker.files[0]); });
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) upload(f);
});

/* ---------- analyse ---------- */
async function upload(file) {
  if (!/\.3mf$/i.test(file.name)) return fail('that is not a .3mf file');
  clearLog();
  $('drop').querySelector('strong').textContent = 'Reading ' + file.name + '\u2026';
  try {
    const r = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'X-Filename': encodeURIComponent(file.name) },
      body: file
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    state.id = data.id;
    state.data = data;
    render(data, file.size);
  } catch (err) {
    fail(err.message);
  } finally {
    $('drop').querySelector('strong').textContent = 'Drop a .3mf here';
    picker.value = '';
  }
}

function fail(msg) {
  show('log');
  $('log').innerHTML = '<span class="err">' + esc(msg) + '</span>';
}

/* ---------- render ---------- */
const KINDS = {
  prusa: 'PrusaSlicer / Orca project',
  bambu: 'Bambu Studio / Orca project',
  plain: 'plain 3MF (no project settings)'
};
const TYPES = ['PLA','PETG','ABS','ASA','PLA-CF','PETG-CF','PC','PA','PA-CF','TPU','PVA','Support For PLA'];

function render(d, size) {
  show('source'); show('options');
  $('log').classList.add('hidden');

  const f = d.footprint;
  $('facts').innerHTML = [
    fact('file', esc(d.filename) + (size ? ' <span class="pill">' + (size/1048576).toFixed(1) + ' MB</span>' : '')),
    fact('format', KINDS[d.kind] || d.kind),
    fact('object', esc(d.object || '?')),
    fact('painted', d.painted_triangles
        ? d.painted_triangles.toLocaleString() + ' triangles'
        : '<span class="err">none found</span>'),
    fact('size', f.x.toFixed(1) + ' &times; ' + f.y.toFixed(1) + ' &times; ' + f.z.toFixed(1) + ' mm'),
    fact('plate', d.bed.x.toFixed(0) + ' &times; ' + d.bed.y.toFixed(0) + ' mm'),
  ].join('');

  let html = '<table><thead><tr><th>Slot</th><th>Colour</th><th>Material</th><th>From</th><th>Painted</th></tr></thead><tbody>';
  d.slots.forEach((s, i) => {
    html += '<tr>' +
      '<td class="num">' + s.slot + '</td>' +
      '<td><input type="color" data-slot="' + i + '" value="' + (s.color || '#ffffff').toLowerCase() + '"></td>' +
      '<td><select data-type="' + i + '">' +
        TYPES.map(t => '<option' + (t === s.type ? ' selected' : '') + '>' + t + '</option>').join('') +
      '</select></td>' +
      '<td class="use">extruder ' + s.source_extruder +
        (s.is_base ? ' <span class="pill">base</span>' : '') + '</td>' +
      '<td class="use">' + (s.painted_triangles ? s.painted_triangles.toLocaleString() + ' tris' : '&mdash;') + '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  if (d.palette_source && d.palette_source !== 'extruder_colour') {
    html += '<p class="hint" style="margin:12px 0 0">colours taken from <b>' + esc(d.palette_source) + '</b></p>';
  }
  if (d.subdivided_triangles) {
    html += '<p class="hint" style="margin:12px 0 0">' + d.subdivided_triangles +
            ' brush-subdivided triangles are copied through unchanged</p>';
  }
  $('slotarea').innerHTML = html;

  const sup = d.support;
  if (sup) {
    let s = 'source file: supports <b>' + (sup.enabled ? 'on' : 'off') + '</b>';
    if (sup.enabled && sup.type) s += ' &mdash; ' + esc(sup.type) + (sup.angle ? ' at ' + sup.angle + '&deg;' : '');
    if (d.supports_painted) s += ' &middot; support painting present';
    $('supporthint').innerHTML = s;
  } else {
    $('supporthint').innerHTML = 'the source file carries no support setting; the profile default is used';
  }

  fillSelect('filament', d.profiles.filament, d.defaults.filament);
  fillSelect('process', d.profiles.process, d.defaults.process);
  $('copies').value = 1;
  updateFitHint();
}

function fact(label, value) {
  return '<div class="fact"><b>' + label + '</b><span>' + value + '</span></div>';
}

function fillSelect(id, options, selected) {
  const el = $(id);
  if (!options || !options.length) options = [selected];
  el.innerHTML = options.map(o =>
    '<option' + (o === selected ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
}

/* ---------- plate fitting ---------- */
function updateFitHint() {
  const d = state.data;
  if (!d) return;
  const cap = d.capacity || 1;
  const copies = Math.max(1, parseInt($('copies').value) || 1);
  const gap = parseFloat($('gap').value) || 0;
  let msg = d.footprint.x.toFixed(1) + ' \u00d7 ' + d.footprint.y.toFixed(1) + ' mm object on a ' +
            d.bed.x.toFixed(0) + ' \u00d7 ' + d.bed.y.toFixed(0) + ' mm plate';
  if (cap > 1) {
    msg += ' \u2014 with ' + gap + ' mm spacing the plate holds <b>' + cap + '</b>' +
           ($('tower').checked ? ' (prime tower kept clear)' : '');
  } else {
    msg += ' \u2014 only one fits';
  }
  if (copies > cap) msg += ' <span class="err">\u2014 you asked for ' + copies + ', it will be capped</span>';
  $('fithint').innerHTML = msg;
  $('fill').disabled = cap <= 1;
}
$('copies').addEventListener('input', updateFitHint);
$('gap').addEventListener('input', () => { updateFitHint(); scheduleReplan(); });
$('tower').addEventListener('change', () => { updateFitHint(); scheduleReplan(); });
$('supports').addEventListener('change', scheduleReplan);
$('filament').addEventListener('change', scheduleReplan);
$('process').addEventListener('change', scheduleReplan);
$('fill').addEventListener('click', () => {
  $('copies').value = state.data ? state.data.capacity : 1;
  updateFitHint();
});

/* the capacity depends on the spacing and the tower, so recount when they change
   instead of showing whatever was computed when the file was uploaded */
let replanTimer = null;
function scheduleReplan() {
  if (!state.id) return;
  clearTimeout(replanTimer);
  replanTimer = setTimeout(replan, 250);
}

async function replan() {
  try {
    const r = await fetch('/api/replan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: state.id,
        gap: parseFloat($('gap').value) || 0,
        avoid_tower: $('tower').checked,
        supports: $('supports').value,
        filament: $('filament').value,
        process: $('process').value
      })
    });
    const d = await r.json();
    if (r.ok) {
      state.data.capacity = d.capacity;
      updateFitHint();
    }
  } catch (err) {
    /* leave the previous number up rather than blanking it */
  }
}

/* ---------- convert ---------- */
$('go').addEventListener('click', async () => {
  if (!state.id) return;
  const colors = [...document.querySelectorAll('input[type=color]')].map(i => i.value.toUpperCase());
  const types = [...document.querySelectorAll('select[data-type]')].map(s => s.value);
  $('go').disabled = true;
  show('log');
  $('log').innerHTML = '<span class="spinner"></span>starting\u2026';

  const body = {
    id: state.id,
    colors, types,
    filament: $('filament').value,
    process: $('process').value,
    copies: Math.max(1, parseInt($('copies').value) || 1),
    gap: parseFloat($('gap').value) || 0,
    reposition: $('repos').checked,
    avoid_tower: $('tower').checked,
    supports: $('supports').value,
    verify: $('verify').checked
  };

  try {
    const r = await fetch('/api/convert', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    poll();
  } catch (err) {
    fail(err.message);
    $('go').disabled = false;
  }
});

function poll() {
  clearTimeout(state.timer);
  state.timer = setTimeout(async () => {
    try {
      const r = await fetch('/api/progress/' + state.id);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'lost the session');
      renderLog(d.logs);
      if (d.state === 'done') return offerDownload(d);
      if (d.state === 'error') { $('log').innerHTML += '\n<span class="err">' + esc(d.error) + '</span>'; $('go').disabled = false; return; }
      poll();
    } catch (err) {
      fail(err.message);
      $('go').disabled = false;
    }
  }, 450);
}

function renderLog(lines) {
  if (!lines.length) {
    $('log').innerHTML = '<span class="spinner"></span>reading the mesh\u2026';
  } else {
    const done = lines.some(l => l.startsWith('output'));
    $('log').innerHTML =
      (done ? '' : '<span class="spinner"></span>') + lines.map(l => esc(l)).join('\n');
  }
  $('log').scrollTop = $('log').scrollHeight;
}

async function offerDownload(d) {
  $('go').disabled = false;
  const r = await fetch('/api/result/' + state.id);
  const blob = await r.blob();
  const name = decodeURIComponent(r.headers.get('X-Suggested-Filename') || 'model-U1.3mf');
  const url = URL.createObjectURL(blob);
  if ($('log')) {
    $('log').innerHTML = renderLogLines(d.logs) +
      '\n\n<a class="dl" href="' + url + '" download="' + esc(name) + '">\u2b07 save ' +
      esc(name) + ' (' + (blob.size / 1048576).toFixed(1) + ' MB)</a>';
  }
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function renderLogLines(lines) { return lines.map(l => esc(l)).join('\n'); }

$('again').addEventListener('click', () => {
  hide('source'); hide('options');
  $('log').classList.add('hidden');
  state.id = null; state.data = null;
  picker.click();
});
function clearLog() { $('log').classList.add('hidden'); $('log').innerHTML = ''; }
</script>
</body>
</html>
